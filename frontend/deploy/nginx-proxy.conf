# Nodographer: proxy a remote meshinfo API under the map's own origin.
# frontend/INSTALL.sh --mode proxy renders @WEB_PATH@ and @MESHINFO_URL@ and
# installs this as /etc/nginx/snippets/nodographer-meshinfo.conf.
#
# Include it inside your server { } block:
#     include snippets/nodographer-meshinfo.conf;
#
# The browser then fetches @WEB_PATH@/meshinfo/map_data.json from this host, so
# there is no CORS and no mixed-content blocking when this site is HTTPS and
# meshinfo is plain HTTP on the mesh. Set "baseUrl": "meshinfo/" in
# frontend/config/nodographer.json.

location @WEB_PATH@/meshinfo/ {
    proxy_pass @MESHINFO_URL@;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    # meshinfo sends ETag + Cache-Control: no-cache; pass them through
    proxy_buffering on;
}
