# Nodographer: optional nginx settings for local mode (meshinfo on this host).
# frontend/INSTALL.sh --mode local renders @WEB_PATH@ and installs this as
# /etc/nginx/snippets/nodographer-local.conf.
#
# Include it inside your server { } block:
#     include snippets/nodographer-local.conf;
#
# frontend/meshinfo is a symlink to the meshinfo data dir; the files there
# change every scan, so make browsers revalidate and send the KML type that
# Google Earth expects. nginx follows the symlink by default
# (disable_symlinks off).

location @WEB_PATH@/meshinfo/ {
    add_header Cache-Control "no-cache" always;
    types {
        application/json                     json;
        text/csv                             csv;
        application/vnd.google-earth.kml+xml kml;
    }
}
