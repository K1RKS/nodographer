<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>MeshMap Node Report</title>

	<!-- Google Fonts: Atkinson Hyperlegible -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

	<!-- DataTables -->
	<link rel="stylesheet" href="css/datatables.css">
	<link rel="stylesheet" href="css/buttons.dataTables.css">
	<link rel="stylesheet" href="css/colReorder.dataTables.css">

	<style>
		:root {
			color-scheme: light dark;
		}

		@media (prefers-color-scheme: light) {
			:root {
				--bg-primary: #ffffff;
				--bg-secondary: #f5f5f5;
				--text-primary: #333333;
				--text-secondary: #666666;
				--border-color: #ddd;
				--header-shadow: rgba(0, 0, 0, 0.05);
				--row-hover: #fafafa;
				--row-stripe: #d7e6f4;
				--header-hover: #f9f9f9;
				--link-color: #0066cc;
				--link-hover: #0052a3;
				--btn-export-bg: linear-gradient(135deg, #c9d6e8 0%, #d4dde8 100%);
				--btn-export-bg-hover: linear-gradient(135deg, #b5c3d8 0%, #c0cad8 100%);
				--btn-export-text: #5a5f7a;
				--btn-export-shadow: rgba(149, 165, 193, 0.4);
				--btn-back-bg: linear-gradient(135deg, #d4c9e8 0%, #d8d4e8 100%);
				--btn-back-bg-hover: linear-gradient(135deg, #c0b5d8 0%, #c8c0d8 100%);
				--btn-back-text: #5a5f7a;
				--btn-back-shadow: rgba(149, 165, 193, 0.4);
				--border-header: 2px solid #b0b0b0;
			}
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg-primary: #1e1e1e;
				--bg-secondary: #2d2d2d;
				--text-primary: #e0e0e0;
				--text-secondary: #a0a0a0;
				--border-color: #444;
				--header-shadow: rgba(0, 0, 0, 0.3);
				--row-hover: #2a2a2a;
				--row-stripe: #2c3f55;
				--header-hover: #252525;
				--link-color: #66b3ff;
				--link-hover: #99ccff;
				--btn-export-bg: linear-gradient(135deg, #4a5a7a 0%, #515d7a 100%);
				--btn-export-bg-hover: linear-gradient(135deg, #5a6a8a 0%, #616d8a 100%);
				--btn-export-text: #e0e0e0;
				--btn-export-shadow: rgba(102, 179, 255, 0.3);
				--btn-back-bg: linear-gradient(135deg, #5a4a7a 0%, #5d5187 100%);
				--btn-back-bg-hover: linear-gradient(135deg, #6a5a8a 0%, #6d6197 100%);
				--btn-back-text: #e0e0e0;
				--btn-back-shadow: rgba(102, 179, 255, 0.3);
				--border-header: 2px solid #555;
			}
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			height: 100dvh;
			overflow: hidden; /* scrolling lives in the table pane */
		}

		body {
			font-family: "Atkinson Hyperlegible Next", sans-serif;
			font-weight: 450;
			font-size: 10px;
			background-color: var(--bg-secondary);
			color: var(--text-primary);
			display: flex;
			flex-direction: column;
			height: 100%;
			height: 100dvh;
			max-height: 100dvh;
			padding-left: env(safe-area-inset-left, 0px);
			padding-right: env(safe-area-inset-right, 0px);
			padding-bottom: env(safe-area-inset-bottom, 0px);
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
			flex-shrink: 0;
			flex-wrap: wrap;
			padding: 15px 20px;
			padding-top: max(15px, env(safe-area-inset-top, 0px));
			background-color: var(--bg-primary);
			border-bottom: 1px solid var(--border-color);
			box-shadow: 0 1px 3px var(--header-shadow);
		}

		.header-left {
			display: flex;
			align-items: center;
			gap: 15px;
			flex-wrap: wrap;
			min-width: 0;
			flex: 1 1 auto;
			order: 1;
		}

		h1 {
			margin: 0;
			font-size: 20px;
			font-weight: 600;
			color: var(--text-primary);
		}

		button, .back-btn {
			font-family: "Atkinson Hyperlegible Next", sans-serif;
			font-size: 11px;
			font-weight: 500;
			padding: 8px 16px;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			transition: all 0.3s ease;
			touch-action: manipulation;
		}

		.back-btn {
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex: 0 0 auto;
			white-space: nowrap;
			order: 2;
			margin-left: auto;
		}

		#exportBtn,
		#columnsBtn {
			background: var(--btn-export-bg);
			color: var(--btn-export-text);
			display: inline-flex;
			align-items: center;
			gap: 6px;
		}

		#exportBtn:hover,
		#columnsBtn:hover {
			background: var(--btn-export-bg-hover);
			box-shadow: 0 4px 12px var(--btn-export-shadow);
			transform: translateY(-1px);
		}

		#exportBtn:active,
		#columnsBtn:active {
			transform: translateY(0);
			box-shadow: 0 2px 6px var(--btn-export-shadow);
		}

		.columns-menu-wrap {
			position: relative;
			display: inline-flex;
		}

		#columnsPanel {
			display: none;
			position: absolute;
			top: calc(100% + 6px);
			left: 0;
			z-index: 40;
			min-width: 220px;
			max-height: min(70vh, 420px);
			overflow: auto;
			padding: 10px 12px;
			background: var(--bg-primary);
			border: 1px solid var(--border-color);
			border-radius: 6px;
			box-shadow: 0 8px 24px var(--header-shadow);
		}

		#columnsPanel.open {
			display: block;
		}

		#columnsPanel .columns-panel-title {
			font-size: 11px;
			font-weight: 600;
			margin: 0 0 8px;
			color: var(--text-secondary);
		}

		#columnsPanel .columns-panel-actions {
			display: flex;
			gap: 8px;
			margin-bottom: 8px;
		}

		#columnsPanel .columns-panel-actions button {
			font-size: 10px;
			padding: 4px 8px;
			border-radius: 4px;
			border: 1px solid var(--border-color);
			background: var(--bg-secondary);
			color: var(--text-primary);
		}

		#columnsList {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		#columnsList label {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 11px;
			color: var(--text-primary);
			cursor: pointer;
			padding: 3px 2px;
			border-radius: 3px;
		}

		#columnsList label:hover {
			background: var(--row-hover);
		}

		#columnsList input {
			margin: 0;
			width: 14px;
			height: 14px;
			cursor: pointer;
		}

		.back-btn {
			background: var(--btn-back-bg);
			color: var(--btn-back-text);
			text-decoration: none;
		}

		.back-btn:hover {
			background: var(--btn-back-bg-hover);
			box-shadow: 0 4px 12px var(--btn-back-shadow);
			transform: translateY(-1px);
		}

		.back-btn:active {
			transform: translateY(0);
			box-shadow: 0 2px 6px var(--btn-back-shadow);
		}

		#tableContainer {
			flex: 1 1 auto;
			min-height: 0;
			overflow: hidden; /* child table row scrolls so bars stay in viewport */
			display: flex;
			flex-direction: column;
			background: var(--bg-primary);
		}

		/* DataTables 2 layout: keep paging visible; scroll the table row only */
		#meshdata_wrapper.dt-container,
		#tableContainer .dt-container {
			flex: 1 1 auto;
			min-height: 0;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			padding: 0 !important;
			width: 100%;
		}

		#tableContainer .dt-layout-row.dt-layout-table {
			flex: 1 1 auto;
			min-height: 0;
			overflow: auto;
			-webkit-overflow-scrolling: touch;
		}

		#tableContainer .dt-layout-row:not(.dt-layout-table) {
			flex: 0 0 auto;
		}

		#tableContainer .dt-layout-cell {
			overflow: visible;
		}

		.dataTables_wrapper {
			padding: 0 !important;
		}

		.dataTables_length {
			display: none !important;
		}

		.dataTables_length label {
			display: none !important;
		}

		.dataTables_filter {
			padding: 10px 15px;
		}

		.dataTables_filter label {
			color: var(--text-primary);
		}

		.dataTables_filter input {
			background-color: var(--bg-secondary);
			color: var(--text-primary);
			border: 1px solid var(--border-color);
			border-radius: 4px;
			padding: 4px 8px;
		}

		/* Emphasize empty-table message */
		/* Hide default DataTables empty message */
		#meshdata td.dataTables_empty,
		table.dataTable td.dataTables_empty {
			display: none;
		}

		/* Custom large empty message outside table */
		#emptyTableMessage {
			display: none;
			text-align: center;
			padding: 60px 20px;
			font-size: 3em;
			font-weight: 700;
			color: var(--text-secondary);
			background-color: var(--bg-secondary);
			border: 1px solid var(--border-color);
			margin-top: 10px;
		}

		#emptyTableMessage.show {
			display: block;
		}

		.dataTables_info {
			padding: 8px 15px;
			font-size: 11px;
			color: var(--text-primary);
		}

		table#meshdata {
			font-size: 10px;
			border-collapse: collapse;
			width: max-content;
			min-width: max-content;
			table-layout: fixed;
		}

		#meshdata thead {
			position: sticky;
			top: 0;
			background-color: var(--bg-primary);
			z-index: 1000;
		}

		#meshdata thead th {
			padding: 6px 8px;
			line-height: 1.2;
			height: auto;
			font-weight: 600;
			border-bottom: var(--border-header);
			background-color: var(--bg-primary);
			color: var(--text-primary);
			text-align: left;
			white-space: nowrap;
			cursor: pointer;
			user-select: none;
			position: sticky;
			top: 0;
			z-index: 1000;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#meshdata thead th:hover {
			background-color: var(--header-hover);
		}

		#meshdata thead th .col-resize-handle {
			position: absolute;
			top: 0;
			right: -3px;
			width: 8px;
			height: 100%;
			cursor: col-resize;
			z-index: 1100;
			touch-action: none;
		}

		#meshdata thead th .col-resize-handle:hover,
		#meshdata thead th .col-resize-handle.is-dragging {
			background: rgba(0, 102, 204, 0.28);
		}

		body.col-resizing {
			cursor: col-resize !important;
			user-select: none !important;
		}

		body.col-resizing #meshdata thead th {
			cursor: col-resize !important;
		}

		#meshdata tbody td {
			padding: 4px 8px;
			line-height: 1;
			height: 14px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			vertical-align: middle;
			border-bottom: 1px solid var(--border-color);
			color: var(--text-primary);
		}

		/* Zebra striping follows current display order (reapplied after sort/filter).
		   Color the cells (not just the tr) so DataTables' inset box-shadow striping
		   cannot wash out the background. */
		#meshdata.display tbody tr.row-stripe > td,
		#meshdata.dataTable tbody tr.row-stripe > td {
			background-color: var(--row-stripe);
			box-shadow: none;
		}

		#meshdata.display tbody tr:hover > td,
		#meshdata.dataTable tbody tr:hover > td,
		#meshdata.display tbody tr.row-stripe:hover > td,
		#meshdata.dataTable tbody tr.row-stripe:hover > td {
			background-color: var(--row-hover);
			box-shadow: none;
		}

		#meshdata a {
			color: var(--link-color);
			text-decoration: none;
		}

		#meshdata a:hover {
			text-decoration: underline;
			color: var(--link-hover);
		}

		#meshdata .col-right,
		#meshdata .col-tiny {
			text-align: right;
		}

			.stale-last-seen {
				color: #c0392b;
				font-weight: 600;
			}

		/* Hide sorting indicator on index column */
		#meshdata thead th:first-child {
			cursor: default !important;
		}

		#meshdata thead th:first-child::after {
			display: none !important;
		}

		#meshdata thead th:first-child span {
			display: none !important;
		}

		.dataTables_paginate {
			padding: 8px 15px;
		}

		#nodeFilter {
			font-family: "Atkinson Hyperlegible Next", sans-serif;
			font-size: 11px;
			padding: 6px 12px;
			border: 1px solid var(--border-color);
			border-radius: 4px;
			background-color: var(--bg-primary);
			color: var(--text-primary);
			cursor: pointer;
			max-width: 100%;
		}

		.filter-check {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-size: 11px;
			color: var(--text-primary);
			cursor: pointer;
			user-select: none;
			white-space: nowrap;
		}

		.filter-check input {
			margin: 0;
			width: 14px;
			height: 14px;
			cursor: pointer;
		}

		/* Phone / narrow tablet: keep Back fully on-screen, stack chrome */
		@media (max-width: 700px) {
			header {
				flex-direction: column;
				align-items: stretch;
				gap: 10px;
				padding: max(12px, env(safe-area-inset-top, 0px))
					max(12px, env(safe-area-inset-right, 0px))
					12px
					max(12px, env(safe-area-inset-left, 0px));
			}

			.back-btn {
				order: -1;
				margin-left: 0;
				align-self: stretch;
				min-height: 44px;
				padding: 10px 14px;
				font-size: 16px;
				box-sizing: border-box;
			}

			.header-left {
				order: 1;
				width: 100%;
				gap: 10px;
			}

			h1 {
				font-size: 18px;
				width: 100%;
			}

			#nodeFilter,
			#exportBtn,
			#columnsBtn,
			.filter-check {
				min-height: 44px;
				font-size: 16px;
				padding: 8px 12px;
			}

			#columnsPanel {
				left: auto;
				right: 0;
				min-width: min(100vw - 24px, 280px);
			}

			#columnsList label {
				font-size: 15px;
				min-height: 36px;
			}

			#columnsList input {
				width: 18px;
				height: 18px;
			}

			.filter-check {
				align-items: center;
			}

			.filter-check input {
				width: 18px;
				height: 18px;
			}

			#nodeFilter {
				flex: 1 1 160px;
			}

			.dataTables_filter {
				padding: 10px 12px;
			}

			.dataTables_filter input {
				font-size: 16px;
				min-height: 40px;
				width: min(100%, 220px);
			}

			#emptyTableMessage {
				font-size: 1.5em;
				padding: 40px 16px;
			}
		}

	</style>
</head>
<body>
	<header>
		<a href="../" class="back-btn">← Back to Map</a>
		<div class="header-left">
			<h1 id="pageTitle">Node Report</h1>
			<label class="filter-check"
				title="Stub nodes appear in mesh topology but have not returned full sysinfo yet (model shows as Not Available). They are kept until retention expiry.">
				<input type="checkbox" id="showStubs" checked>
				Show Stubs
			</label>
			<select id="nodeFilter" title="Missing nodes were not successfully polled on the latest scan">
				<option value="">All Nodes</option>
				<option value="missing">Missing Nodes</option>
			</select>
			<div class="columns-menu-wrap">
				<button type="button" id="columnsBtn" aria-expanded="false" aria-controls="columnsPanel">Display Columns</button>
				<div id="columnsPanel" role="dialog" aria-label="Display columns">
					<p class="columns-panel-title">Show / hide columns</p>
					<div class="columns-panel-actions">
						<button type="button" id="columnsShowAll">Show all</button>
						<button type="button" id="columnsHideOptional">Hide optional</button>
					</div>
					<div id="columnsList"></div>
				</div>
			</div>
			<button id="exportBtn">Export</button>
		</div>
	</header>

	<div id="tableContainer">
		<table id="meshdata" class="display">
			<thead>
				<tr>
					<th>#</th>
					<th>Name</th>
					<th>Location</th>
					<th>IP</th>
					<th>Description</th>
					<th>Channel</th>
					<th>Freq</th>
					<th>SSID</th>
					<th>Model</th>
					<th>Hardware</th>
					<th>Azimuth</th>
					<th>Version</th>
					<th title="Active tunnels">Tunnels</th>
					<th>Response</th>
					<th>Hops</th>
					<th>Uptime</th>
					<th>Last Seen</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
		<div id="emptyTableMessage">No data available in table</div>
	</div>

	<!-- Scripts -->
	<script src="js/jquery-3.7.1.js"></script>
	<script src="js/datatables.min.js"></script>
	<script src="js/dataTables.buttons.js"></script>
	<script src="js/jszip.js"></script>
	<script src="js/pdfmake.js"></script>
	<script src="js/buttons.html5.js"></script>
	<script src="js/dataTables.colReorder.js"></script>
	<script src="../js/nodographer-config.js"></script>

	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const isStubNode = (row) => (row.model || '') === 'Not Available';

			const isMissingNode = (row) => {
				if (typeof row.polled_this_cycle === 'boolean') {
					return !row.polled_this_cycle;
				}
				// Older snapshots without the flag: treat blank/zero response as not polled
				const ms = Number(row.response_time_ms);
				return !Number.isFinite(ms) || ms <= 0;
			};

			const getFilterParam = () => {
				const params = new URLSearchParams(window.location.search);
				const filter = (params.get('filter') || '').toLowerCase();
				return filter === 'missing' ? 'missing' : '';
			};

			const setFilterParam = (value) => {
				const url = new URL(window.location.href);
				url.searchParams.delete('proto'); // retired protocol filter
				if (value) {
					url.searchParams.set('filter', value);
				} else {
					url.searchParams.delete('filter');
				}
				window.history.replaceState({}, '', url.toString());
			};

			const getShowStubsParam = () => {
				const params = new URLSearchParams(window.location.search);
				const stubs = (params.get('stubs') || '').toLowerCase();
				// Default ON; only hide when stubs=0|false|off
				return !(stubs === '0' || stubs === 'false' || stubs === 'off');
			};

			const setShowStubsParam = (show) => {
				const url = new URL(window.location.href);
				if (show) {
					url.searchParams.delete('stubs');
				} else {
					url.searchParams.set('stubs', '0');
				}
				window.history.replaceState({}, '', url.toString());
			};

			const setReportTitles = (browserTitle, pageTitle) => {
				document.title = browserTitle || 'Node Report';
				document.getElementById('pageTitle').textContent = pageTitle || 'Node Report';
			};

			// Report titles come from config/nodographer.json; older setups
			// without it still carry them in map_data.json's mapInfo.
			const configReady = NodographerConfig.load('../').then(() => {
				const cfg = NodographerConfig.map();
				if (cfg.reportBrowserTitle || cfg.reportPageTitle) {
					setReportTitles(cfg.reportBrowserTitle, cfg.reportPageTitle);
					return;
				}
				return fetch(NodographerConfig.dataUrl('map_data.json'), { cache: 'no-store' })
					.then(response => response.json())
					.then(data => setReportTitles(data.mapInfo?.reportBrowserTitle, data.mapInfo?.reportPageTitle))
					.catch(error => {
						console.error('Error loading map data for titles:', error);
						setReportTitles();
					});
			});

			// Helper functions for cell rendering with tooltips
			const renderCellWithTooltip = (data) => {
				if (!data) return '';
				return `<span title="${data}">${data}</span>`;
			};

			const renderFullCell = (data) => {
				if (!data) return '';
				return `<span title="${String(data).replace(/"/g, '&quot;')}">${data}</span>`;
			};

			const isOlderThanHours = (value, hours) => {
				if (!value) return false;
				const d = new Date(value);
				if (Number.isNaN(d.getTime())) return false;
				const diffMs = Date.now() - d.getTime();
				return diffMs > hours * 60 * 60 * 1000;
			};

			const formatLastSeen = (value) => {
				if (!value) return '';
				const d = new Date(value);
				if (Number.isNaN(d.getTime())) return value || '';
				const year = d.getFullYear();
				const month = String(d.getMonth() + 1).padStart(2, '0');
				const day = String(d.getDate()).padStart(2, '0');
				const hours24 = d.getHours();
				const ampm = hours24 >= 12 ? 'PM' : 'AM';
				const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
				const hours = String(hours12).padStart(2, '0');
				const minutes = String(d.getMinutes()).padStart(2, '0');
				const seconds = String(d.getSeconds()).padStart(2, '0');
				return `${year}-${month}-${day} ${hours}:${minutes}:${seconds} ${ampm}`;
			};

			const isBlank = (v) => v === null || v === undefined || v === '' ||
				String(v).toLowerCase() === 'none' || v === 'Not Available';

			// Fixed-width key so numbers sort by value under the string-based nulls-last sort
			const numSortKey = (v) => {
				const n = parseFloat(v);
				if (isBlank(v) || Number.isNaN(n)) return '';
				return String(Math.round((n + 1e6) * 1000)).padStart(12, '0');
			};

			const ipSortKey = (ip) => {
				if (isBlank(ip)) return '';
				return String(ip).split('.').map(p => p.padStart(3, '0')).join('.');
			};

			const hasLocation = (row) => {
				const lat = parseFloat(row.lat), lon = parseFloat(row.lon);
				return !Number.isNaN(lat) && !Number.isNaN(lon) && (lat !== 0 || lon !== 0);
			};

			const formatLocation = (row) => hasLocation(row) ? `${row.lat}, ${row.lon}` : '';

			const renderLocation = (data, type, row) => {
				const text = formatLocation(row);
				if (type !== 'display' || !text) return text;
				// Map URL hash is #zoom/lat/lon
				return `<a href="../#16/${row.lat}/${row.lon}" title="Show on map">${text}</a>`;
			};

			const formatAzimuth = (v) => isBlank(v) ? '' : `${parseFloat(v)}°`;

			// AREDN uptime looks like "69 days, 4:22" or "4:22:10"
			const uptimeSeconds = (v) => {
				if (isBlank(v)) return null;
				const s = String(v);
				const days = /(\d+)\s*day/.exec(s);
				const clock = /(\d+):(\d+)(?::(\d+))?\s*$/.exec(s);
				if (!days && !clock) return null;
				let secs = days ? parseInt(days[1], 10) * 86400 : 0;
				if (clock) {
					secs += parseInt(clock[1], 10) * 3600 + parseInt(clock[2], 10) * 60 + parseInt(clock[3] || '0', 10);
				}
				return secs;
			};

			const renderLastSeen = (data) => {
				const formatted = formatLastSeen(data);
				if (!formatted) return '';
				const staleClass = isOlderThanHours(data, 2) ? 'stale-last-seen' : '';
				return `<span class="${staleClass}" title="${data || ''}">${formatted}</span>`;
			};

			// Custom sort plugin: blanks always at end, regardless of sort direction
			// This uses a different approach that leverages DataTables' row data
			$.fn.dataTable.ext.type.order['nulls-last-pre'] = function(d) {
				return d === '' ? '\uffff' : d;
			};
			
			// Note: The secondary sort (Name column) is handled by DataTables' orderMulti setting
			// Blanks will be grouped at the end and sorted by Name within that group
			$.fn.dataTable.ext.type.order['nulls-last-asc'] = function(a, b) {
				const aIsBlank = a === '\uffff';
				const bIsBlank = b === '\uffff';
				if (aIsBlank && bIsBlank) return 0;
				if (aIsBlank) return 1;  // blanks to end
				if (bIsBlank) return -1;
				return a.localeCompare(b);
			};
			$.fn.dataTable.ext.type.order['nulls-last-desc'] = function(a, b) {
				const aIsBlank = a === '\uffff';
				const bIsBlank = b === '\uffff';
				if (aIsBlank && bIsBlank) return 0;
				if (aIsBlank) return 1;  // blanks always to end, even in desc
				if (bIsBlank) return -1;
				return b.localeCompare(a);  // reverse the comparison for descending
			};

			const nodeFilterEl = document.getElementById('nodeFilter');
			const showStubsEl = document.getElementById('showStubs');
			if (nodeFilterEl) {
				nodeFilterEl.value = getFilterParam();
			}
			if (showStubsEl) {
				showStubsEl.checked = getShowStubsParam();
			}

			// Load node data statically
			let allNodeData = [];
			
			const applyNodeFilters = (dataset) => {
				const showStubs = showStubsEl ? showStubsEl.checked : true;
				const filter = nodeFilterEl ? nodeFilterEl.value : getFilterParam();
				let rows = Array.isArray(dataset) ? dataset.slice() : [];
				if (!showStubs) {
					rows = rows.filter(row => !isStubNode(row));
				}
				if (filter === 'missing') {
					rows = rows.filter(row => isMissingNode(row));
				}
				return rows;
			};

			// Fetch and filter data based on Show Stubs / All|Missing
			const loadNodeData = async function() {
				try {
					await configReady;
					const response = await fetch(NodographerConfig.dataUrl('node_report_data.json'), { cache: 'no-store' });
					const json = await response.json();
					const dataset = Array.isArray(json) ? json : [];
					allNodeData = applyNodeFilters(dataset);
					
					// Clear and reload table with new data
					table.clear().rows.add(allNodeData).draw();
					scheduleColumnLayout();
				} catch (error) {
					console.error('Error loading node data:', error);
				}
			};

			// Initialize DataTable with static data
			const table = new DataTable('#meshdata', {
				autoWidth: false,
				columns: [
					{
						data: null,
						sortable: false,
						render: function(data, type, row, meta) {
							// Return sequential index based on display order
							return meta.row + 1;
						}
					},
					{
						data: 'node',
						render: function(data) {
							if (!data) return '';
							const nodeName = data.toLowerCase();
							return `<a href="http://${nodeName}.local.mesh" target="_blank" title="${data}">${nodeName}</a>`;
						}
					},
					{
						data: null,
						render: renderLocation
					},
					{
						data: 'wlan_ip',
						render: (data, type) => type === 'sort' ? ipSortKey(data) : (isBlank(data) ? '' : data)
					},
					{
						data: 'description',
						render: (data) => renderFullCell(data)
					},
					{
						data: 'channel',
						className: 'col-right',
						render: (data, type) => type === 'sort' ? numSortKey(data) : (isBlank(data) ? '' : String(data))
					},
					{
						data: 'freq',
						render: renderCellWithTooltip
					},
					{
						data: 'ssid',
						className: 'col-ssid',
						render: (data) => renderFullCell(data)
					},
					{
						data: 'model',
						className: 'col-model',
						render: (data) => renderFullCell(data)
					},
					{
						data: 'board_id',
						className: 'col-model',
						render: (data) => renderFullCell(data)
					},
					{
						data: 'antAzimuth',
						className: 'col-right',
						render: (data, type) => type === 'sort' ? numSortKey(data) : formatAzimuth(data)
					},
					{
						data: 'firmware_version',
						className: 'col-version',
						render: renderCellWithTooltip
					},
					{
						data: 'active_tunnel_count',
						className: 'col-right',
						type: 'num',
						render: function(data) {
							if (!data || data === 0) return '';
							return parseInt(data).toString();
						}
					},
					{
						data: 'response_time_ms',
						type: 'num',
						className: 'col-tiny',
						render: function(data) {
							if (!data || data === 0) return '';
							return data.toString();
						}
					},
					{
						data: 'hopsAway',
						type: 'num',
						className: 'col-tiny',
						render: function(data) {
							if (!data || data === 0) return '';
							return data.toString();
						}
					},
					{
						data: 'uptime',
						render: (data, type) => {
							if (type === 'sort') return numSortKey(uptimeSeconds(data));
							return isBlank(data) ? '' : renderCellWithTooltip(data);
						}
					},
					{
						data: 'last_seen',
						render: renderLastSeen
					}
				],
			colReorder: true,
			order: [[1, 'asc']],
			orderMulti: true,
			pageLength: 500,
			processing: true,
			responsive: false,
			orderClasses: false,
			columnDefs: [
					{
						targets: '_all',
						type: 'nulls-last',
						orderable: true
					}
				],
				rowCallback: function(row, data, displayIndex) {
					// Update the index column with sequential line numbers
					$(row).find('td:first').text(displayIndex + 1);
					// Stripe by display order so zebra banding stays correct after sort/filter
					row.classList.toggle('row-stripe', displayIndex % 2 === 1);
				},
				layout: {
					topStart: null,
					topEnd: null,
					bottomStart: null,
					bottomEnd: 'paging'
				}
			});

			// Enforce binary sorting: toggle between ascending and descending only
			let lastSortedColumn = 1; // Track the last sorted column (Name column by default)
			let lastSortDirection = 'asc'; // Track the last sort direction
			let isProcessingSort = false; // Flag to prevent recursive calls
			let isInitialLoad = true; // Flag to identify initial page load

			table.on('order.dt', function(e, settings) {
				if (isProcessingSort) return; // Prevent recursive event handling
				
				const order = settings.aaSorting;
				
				// On initial load, just sync the tracking variables and return
				if (isInitialLoad) {
					isInitialLoad = false;
					if (order.length > 0) {
						lastSortedColumn = order[0][0];
						lastSortDirection = order[0][1];
					}
					return;
				}
				
				// Always ensure Name column (1) is the secondary sort key
				const hasNameSecondary = order.length > 1 && order[1][0] === 1;
				
				if (order.length === 0) {
					// If order is empty, revert to the last sort with Name as secondary
					isProcessingSort = true;
					table.order([[lastSortedColumn, lastSortDirection], [1, 'asc']]).draw(false);
					isProcessingSort = false;
				} else {
					const currentColumn = order[0][0];
					const currentDirection = order[0][1];
					
					// If the same column is clicked again, toggle direction
					if (currentColumn === lastSortedColumn) {
						const newDirection = lastSortDirection === 'asc' ? 'desc' : 'asc';
						isProcessingSort = true;
						table.order([[currentColumn, newDirection], [1, 'asc']]).draw(false);
						isProcessingSort = false;
						lastSortDirection = newDirection;
					} else {
						// New column clicked, start with ascending
						lastSortedColumn = currentColumn;
						lastSortDirection = 'asc';
						if (currentDirection !== 'asc' || !hasNameSecondary) {
							isProcessingSort = true;
							table.order([[currentColumn, 'asc'], [1, 'asc']]).draw(false);
							isProcessingSort = false;
						} else {
							// Just update tracking if already ascending with Name as secondary
							lastSortDirection = 'asc';
						}
					}
				}
			});

			if (nodeFilterEl) {
				nodeFilterEl.addEventListener('change', function() {
					setFilterParam(this.value);
					loadNodeData();
				});
			}
			if (showStubsEl) {
				showStubsEl.addEventListener('change', function() {
					setShowStubsParam(this.checked);
					loadNodeData();
				});
			}

			// --- Display Columns (show/hide) ---
			const COL_VIS_KEY = 'nodographer.nodeReport.columnVisibility';
			const COL_WIDTH_KEY = 'nodographer.nodeReport.columnWidths';
			const ALWAYS_ON_COLUMNS = new Set(['#', 'Name']); // keep identity columns available
			const COL_WIDTH_MIN = 36;
			const COL_WIDTH_PAD = 16;
			/* Soft cap for initial autofit so one long Description doesn't dominate;
			   drag or double-click-fit can still go wider. */
			const COL_WIDTH_AUTOFIT_MAX = 480;
			const columnsBtn = document.getElementById('columnsBtn');
			const columnsPanel = document.getElementById('columnsPanel');
			const columnsList = document.getElementById('columnsList');
			let columnLayoutTimer = null;
			let resizeHandlesInstalled = false;

			const columnTitle = (idx) => {
				const th = table.column(idx).header();
				if (!th) return `Column ${idx}`;
				const clone = th.cloneNode(true);
				clone.querySelectorAll('.col-resize-handle').forEach((el) => el.remove());
				const titled = (th.getAttribute('title') || '').trim();
				const text = (clone.textContent || '').trim();
				return titled || text || `Column ${idx}`;
			};

			const loadSavedColumnWidths = () => {
				try {
					const raw = localStorage.getItem(COL_WIDTH_KEY);
					if (!raw) return {};
					const parsed = JSON.parse(raw);
					return parsed && typeof parsed === 'object' ? parsed : {};
				} catch (e) {
					return {};
				}
			};

			const saveColumnWidth = (title, px) => {
				const saved = loadSavedColumnWidths();
				saved[title] = Math.round(px);
				try {
					localStorage.setItem(COL_WIDTH_KEY, JSON.stringify(saved));
				} catch (e) {
					/* ignore */
				}
			};

			const clearSavedColumnWidth = (title) => {
				const saved = loadSavedColumnWidths();
				if (!Object.prototype.hasOwnProperty.call(saved, title)) return;
				delete saved[title];
				try {
					localStorage.setItem(COL_WIDTH_KEY, JSON.stringify(saved));
				} catch (e) {
					/* ignore */
				}
			};

			const measureColumnContentWidth = (idx, { uncapped = false } = {}) => {
				const th = table.column(idx).header();
				if (!th) return COL_WIDTH_MIN;
				const sampleTd = table.column(idx, { page: 'current' }).nodes().toArray()[0];
				const probe = document.createElement('div');
				probe.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap;pointer-events:none;';
				document.body.appendChild(probe);

				const measureNode = (node, asHeader) => {
					if (!node) return 0;
					const style = window.getComputedStyle(node);
					probe.style.fontFamily = style.fontFamily;
					probe.style.fontSize = style.fontSize;
					probe.style.fontWeight = asHeader ? style.fontWeight : '450';
					probe.style.letterSpacing = style.letterSpacing;
					const clone = node.cloneNode(true);
					clone.querySelectorAll('.col-resize-handle').forEach((el) => el.remove());
					const text = (clone.textContent || '').trim();
					probe.textContent = text || (asHeader ? 'W' : '');
					return text ? probe.offsetWidth : 0;
				};

				let max = measureNode(th, true);
				table.column(idx, { page: 'current' }).nodes().each(function(td) {
					max = Math.max(max, measureNode(td, false));
				});
				// Prefer a real body cell font if header-only column
				if (!sampleTd) {
					/* keep header measure */
				}
				document.body.removeChild(probe);
				const padded = Math.max(COL_WIDTH_MIN, max + COL_WIDTH_PAD);
				return uncapped ? padded : Math.min(padded, COL_WIDTH_AUTOFIT_MAX);
			};

			const applyColumnWidths = (widthsByIndex) => {
				const tableEl = document.getElementById('meshdata');
				let total = 0;
				table.columns().every(function(idx) {
					if (!this.visible()) {
						$(this.header()).css('width', '');
						$(this.nodes()).css('width', '');
						return;
					}
					const w = widthsByIndex[idx] || COL_WIDTH_MIN;
					total += w;
					$(this.header()).css({ width: w + 'px', minWidth: w + 'px', maxWidth: w + 'px' });
					$(this.nodes()).css({ width: w + 'px', minWidth: w + 'px', maxWidth: w + 'px' });
				});
				if (tableEl) {
					tableEl.style.width = Math.max(total, 1) + 'px';
					tableEl.style.minWidth = Math.max(total, 1) + 'px';
					tableEl.style.maxWidth = 'none';
					tableEl.style.tableLayout = 'fixed';
				}
			};

			const layoutColumns = (opts = {}) => {
				const forceAutofit = !!opts.forceAutofit;
				const uncapped = !!opts.uncapped;
				const onlyIdx = Number.isInteger(opts.onlyIdx) ? opts.onlyIdx : null;
				const saved = loadSavedColumnWidths();
				const widths = {};

				table.columns().every(function(idx) {
					if (!this.visible()) return;
					if (onlyIdx !== null && idx !== onlyIdx) {
						const th = this.header();
						const current = th ? parseFloat(th.style.width) : NaN;
						widths[idx] = Number.isFinite(current) && current > 0
							? current
							: measureColumnContentWidth(idx);
						return;
					}
					const title = columnTitle(idx);
					if (!forceAutofit && Object.prototype.hasOwnProperty.call(saved, title)) {
						widths[idx] = Math.max(COL_WIDTH_MIN, Number(saved[title]) || COL_WIDTH_MIN);
					} else {
						widths[idx] = measureColumnContentWidth(idx, { uncapped: uncapped || forceAutofit });
					}
				});
				applyColumnWidths(widths);
			};

			const scheduleColumnLayout = (opts) => {
				if (columnLayoutTimer) clearTimeout(columnLayoutTimer);
				columnLayoutTimer = setTimeout(() => layoutColumns(opts || {}), 30);
			};

			const installColumnResizeHandles = () => {
				if (resizeHandlesInstalled) {
					// Re-bind after colReorder may rewrite headers
					document.querySelectorAll('#meshdata thead th .col-resize-handle').forEach((el) => el.remove());
				}
				resizeHandlesInstalled = true;

				table.columns().every(function(idx) {
					const th = this.header();
					if (!th || !this.visible()) return;
					th.style.position = 'sticky';
					const handle = document.createElement('span');
					handle.className = 'col-resize-handle';
					handle.title = 'Drag to resize · double-click to fit content';
					handle.addEventListener('mousedown', (e) => {
						e.preventDefault();
						e.stopPropagation();
						const startX = e.clientX;
						const startWidth = th.getBoundingClientRect().width;
						handle.classList.add('is-dragging');
						document.body.classList.add('col-resizing');

						const onMove = (ev) => {
							const next = Math.max(COL_WIDTH_MIN, startWidth + (ev.clientX - startX));
							const widths = {};
							table.columns().every(function(colIdx) {
								if (!this.visible()) return;
								if (colIdx === idx) {
									widths[colIdx] = next;
									return;
								}
								const header = this.header();
								const w = header ? parseFloat(header.style.width) : NaN;
								widths[colIdx] = Number.isFinite(w) && w > 0 ? w : measureColumnContentWidth(colIdx);
							});
							applyColumnWidths(widths);
						};

						const onUp = () => {
							document.removeEventListener('mousemove', onMove);
							document.removeEventListener('mouseup', onUp);
							handle.classList.remove('is-dragging');
							document.body.classList.remove('col-resizing');
							const finalWidth = th.getBoundingClientRect().width;
							saveColumnWidth(columnTitle(idx), finalWidth);
						};

						document.addEventListener('mousemove', onMove);
						document.addEventListener('mouseup', onUp);
					});
					handle.addEventListener('dblclick', (e) => {
						e.preventDefault();
						e.stopPropagation();
						clearSavedColumnWidth(columnTitle(idx));
						// Fit to true widest cell (no soft cap)
						layoutColumns({ forceAutofit: true, uncapped: true, onlyIdx: idx });
					});
					handle.addEventListener('click', (e) => {
						e.preventDefault();
						e.stopPropagation();
					});
					th.appendChild(handle);
				});
			};

			const loadColumnVisibility = () => {
				try {
					const raw = localStorage.getItem(COL_VIS_KEY);
					if (!raw) return {};
					const parsed = JSON.parse(raw);
					return parsed && typeof parsed === 'object' ? parsed : {};
				} catch (e) {
					return {};
				}
			};

			const saveColumnVisibility = () => {
				const state = {};
				table.columns().every(function(idx) {
					state[columnTitle(idx)] = this.visible();
				});
				try {
					localStorage.setItem(COL_VIS_KEY, JSON.stringify(state));
				} catch (e) {
					/* ignore quota / private mode */
				}
			};

			const applySavedColumnVisibility = () => {
				const saved = loadColumnVisibility();
				table.columns().every(function(idx) {
					const title = columnTitle(idx);
					if (Object.prototype.hasOwnProperty.call(saved, title)) {
						const show = ALWAYS_ON_COLUMNS.has(title) ? true : !!saved[title];
						this.visible(show, false);
					}
				});
				table.columns.adjust().draw(false);
			};

			const rebuildColumnsList = () => {
				if (!columnsList) return;
				columnsList.innerHTML = '';
				table.columns().every(function(idx) {
					const title = columnTitle(idx);
					const locked = ALWAYS_ON_COLUMNS.has(title);
					const label = document.createElement('label');
					const input = document.createElement('input');
					input.type = 'checkbox';
					input.checked = this.visible();
					input.disabled = locked;
					input.dataset.columnIndex = String(idx);
					input.setAttribute('aria-label', `Show ${title}`);
					if (locked) {
						label.title = 'Required column';
					}
					input.addEventListener('change', () => {
						const colIdx = parseInt(input.dataset.columnIndex, 10);
						table.column(colIdx).visible(input.checked);
						saveColumnVisibility();
						installColumnResizeHandles();
						scheduleColumnLayout();
					});
					label.appendChild(input);
					label.appendChild(document.createTextNode(title));
					columnsList.appendChild(label);
				});
			};

			const setColumnsPanelOpen = (open) => {
				if (!columnsPanel || !columnsBtn) return;
				columnsPanel.classList.toggle('open', open);
				columnsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
				if (open) rebuildColumnsList();
			};

			applySavedColumnVisibility();
			installColumnResizeHandles();
			table.on('columns-reordered', function() {
				installColumnResizeHandles();
				scheduleColumnLayout();
			});
			table.on('draw', function() {
				// Keep stripe/# index updates; refresh handles if headers were rebuilt
				if (!document.querySelector('#meshdata thead th .col-resize-handle')) {
					installColumnResizeHandles();
				}
			});

			if (columnsBtn && columnsPanel) {
				columnsBtn.addEventListener('click', (e) => {
					e.stopPropagation();
					setColumnsPanelOpen(!columnsPanel.classList.contains('open'));
				});
				columnsPanel.addEventListener('click', (e) => e.stopPropagation());
				document.addEventListener('click', () => setColumnsPanelOpen(false));
				document.addEventListener('keydown', (e) => {
					if (e.key === 'Escape') setColumnsPanelOpen(false);
				});
			}

			const columnsShowAll = document.getElementById('columnsShowAll');
			const columnsHideOptional = document.getElementById('columnsHideOptional');
			if (columnsShowAll) {
				columnsShowAll.addEventListener('click', () => {
					table.columns().visible(true);
					saveColumnVisibility();
					rebuildColumnsList();
					installColumnResizeHandles();
					scheduleColumnLayout();
				});
			}
			if (columnsHideOptional) {
				columnsHideOptional.addEventListener('click', () => {
					table.columns().every(function(idx) {
						const title = columnTitle(idx);
						this.visible(ALWAYS_ON_COLUMNS.has(title), false);
					});
					table.columns.adjust().draw(false);
					saveColumnVisibility();
					rebuildColumnsList();
					installColumnResizeHandles();
					scheduleColumnLayout();
				});
			}

			// Helper to show/hide custom empty message
			const updateEmptyMessage = () => {
				const emptyMsg = document.getElementById('emptyTableMessage');
				const visibleRows = table.rows({ filter: 'applied' }).count();
				if (visibleRows === 0) {
					emptyMsg.classList.add('show');
				} else {
					emptyMsg.classList.remove('show');
				}
			};

			// Update empty message on draw
			table.on('draw', updateEmptyMessage);
			updateEmptyMessage();

			// Export currently visible columns only
			document.getElementById('exportBtn').addEventListener('click', function() {
				const visibleIdx = [];
				const headers = [];
				table.columns().every(function(idx) {
					if (!this.visible()) return;
					visibleIdx.push(idx);
					headers.push(columnTitle(idx));
				});

				const valueFor = (row, idx, rowIndex) => {
					switch (idx) {
						case 0: return rowIndex;
						case 1: return row.node || '';
						case 2: return formatLocation(row);
						case 3: return isBlank(row.wlan_ip) ? '' : row.wlan_ip;
						case 4: return row.description || '';
						case 5: return isBlank(row.channel) ? '' : row.channel;
						case 6: return row.freq || '';
						case 7: return row.ssid || '';
						case 8: return row.model || '';
						case 9: return row.board_id || '';
						case 10: return formatAzimuth(row.antAzimuth);
						case 11: return row.firmware_version || '';
						case 12: return row.active_tunnel_count || '';
						case 13: return row.response_time_ms ? `${row.response_time_ms} ms` : '';
						case 14: return row.hopsAway || '';
						case 15: return isBlank(row.uptime) ? '' : row.uptime;
						case 16: return formatLastSeen(row.last_seen);
						default: return '';
					}
				};

				const rows = [headers.join('\t')];
				let rowIndex = 1;
				table.rows({ filter: 'applied' }).data().each(function(row) {
					rows.push(visibleIdx.map((idx) => valueFor(row, idx, rowIndex)).join('\t'));
					rowIndex++;
				});

				const csv = rows.join('\n');
				const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
				const link = document.createElement('a');
				const url = URL.createObjectURL(blob);
				link.setAttribute('href', url);
				link.setAttribute('download', `meshmap-nodes-${new Date().toISOString().split('T')[0]}.csv`);
				link.click();
				URL.revokeObjectURL(url);
			});

			// Load initial data
			loadNodeData();
		});
	</script>
</body>
</html>
