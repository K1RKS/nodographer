# Nodographer: nginx site for a dedicated host (written by lxc-install.sh).
# lxc-install.sh renders @ROOT_REDIRECT@ and installs this as
# /etc/nginx/sites-available/nodographer, replacing the default site.
#
# Component snippets are picked up by the wildcard include:
#   nodographer-local.conf     frontend, meshinfo on this host
#   nodographer-meshinfo.conf  frontend, proxy to a remote meshinfo API
#   nodographer-api.conf       this host's meshinfo API under /api/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location = / {
        return 302 @ROOT_REDIRECT@;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/nodographer-*.conf;
}
