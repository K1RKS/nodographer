# meshinfo: publish this host's API through nginx on port 80.
# lxc-install.sh renders @API_PORT@ and installs this as
# /etc/nginx/snippets/nodographer-api.conf. To use it in your own nginx
# config, include it inside a server { } block:
#     include snippets/nodographer-api.conf;
#
# A remote frontend can then use http://<this-host>/api/v1/ instead of
# port @API_PORT@, which helps when only port 80 (or 443) is open.

location /api/ {
    proxy_pass http://127.0.0.1:@API_PORT@/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /healthz {
    proxy_pass http://127.0.0.1:@API_PORT@/healthz;
}
